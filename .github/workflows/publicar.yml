name: Publicar

# Publicación BAJO DEMANDA.
# Un push a main no publica: se publica al empujar una etiqueta `v*`
# (o desde Actions → Publicar → Run workflow). Así el desarrollo no mueve el
# sitio que ya circula.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # la fuente debe compilar a lo versionado: si alguien edita el JSON y no regenera, falla
      - run: pnpm data
      - run: git diff --exit-code data/ src/lib/data/curriculum.json

      # las pruebas antes de publicar: si algo se rompe, no sale
      - run: pnpm check
      - run: pnpm test

      # el sitio vive bajo /<repositorio>/
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # habilita Pages en el repositorio si aún no está activo
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
